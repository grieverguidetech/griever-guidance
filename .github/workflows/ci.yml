name: CI

# Gates every PR and every push to main. Deploy (.github/workflows/deploy.yml)
# runs only after this workflow succeeds on main, so a red CI never ships.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, unit + integration tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # Version comes from package.json's "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v4

      # A focused or skipped test passes CI while testing nothing.
      # (Playwright's test.fail() is allowed: it marks a tracked known failure
      # and turns red once the failure is fixed.)
      - name: Forbid .only, .skip and .todo in tests
        run: |
          if grep -rEn --include='*.spec.ts' --include='*.spec.tsx' --include='*.test.ts' --include='*.test.tsx' \
              '\b(it|test|describe)\.(only|skip|todo)\(' apps libs --exclude-dir=node_modules; then
            echo "::error::Remove .only/.skip/.todo from tests"; exit 1
          fi

      - run: pnpm nx affected -t typecheck --base=$NX_BASE --head=$NX_HEAD --parallel=3

      - run: pnpm nx affected -t test --base=$NX_BASE --head=$NX_HEAD --parallel=3

      # mobile:build shells out to the EAS CLI, which isn't available (or
      # configured) in CI. Web/gateway/marketing builds are what gate deploys.
      - run: pnpm nx affected -t build --base=$NX_BASE --head=$NX_HEAD --parallel=3 --exclude=mobile

  # DynamoDB Local + SES stand-in integration tests (#210). Runs on every PR and every push to main
  # (no path filter: it is a small job). The tests fail, not skip, if a service is unreachable
  # (AWS_LOCAL_REQUIRED).
  aws-local:
    name: AWS local stack (DynamoDB Local, SES stand-in)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.1.0
        ports:
          - 8100:8000
    env:
      AWS_LOCAL_REQUIRED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start the SES stand-in
        run: |
          nohup pnpm exec aws-ses-v2-local --port 8105 > ses.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8105/health-check && exit 0
            sleep 1
          done
          cat ses.log
          exit 1

      - run: pnpm nx test data-aws --skip-nx-cache

      - run: pnpm nx test data-access --skip-nx-cache

      - run: pnpm nx test gateway-flows --skip-nx-cache

  e2e:
    name: Playwright e2e (desktop)
    runs-on: ubuntu-latest
    # Official Playwright image: browsers and system packages are baked in (#689). Keep the tag
    # equal to the @playwright/test version in pnpm-lock.yaml; a step below enforces it.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --ipc=host
    # A hung browser install once held this job for 47 minutes; fail fast instead.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The image carries Chromium and its system packages, so nothing is downloaded from apt.
      # Its tag must equal the installed @playwright/test, or Playwright looks for a browser build
      # the image does not have. The tag is read from the `image:` line above (one source).
      - name: Check Playwright image matches installed version
        run: |
          installed="$(pnpm exec playwright --version | awk '{print $2}')"
          image="$(sed -n 's/^ *image: mcr.microsoft.com\/playwright:v\([0-9.]*\)-.*/\1/p' .github/workflows/ci.yml)"
          if [ "$installed" != "$image" ]; then
            echo "::error::Playwright image is v${image} but @playwright/test is ${installed}. Update the e2e job image in .github/workflows/ci.yml to mcr.microsoft.com/playwright:v${installed}-noble."
            exit 1
          fi

      # Always runs (not `affected`): it is the only check that the whole
      # journey works in a real browser, and it takes about a minute.
      - run: pnpm nx e2e web-e2e

      # The editor (#396) is behind VITE_FEATURE_CMS, a build-time flag, so it needs its own flag-on
      # build and server. Nx does not infer a target from this config, so call Playwright directly.
      - name: Playwright e2e (web editor, flag on)
        run: pnpm exec playwright test -c apps/web-e2e/playwright.cms.config.ts

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web-e2e/test-output
            dist/.playwright
          retention-days: 14
