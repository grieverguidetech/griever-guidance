name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v4

      # Typecheck everything affected (mobile included — it passes).
      - run: pnpm nx affected -t typecheck --base=$NX_BASE --head=$NX_HEAD --parallel=3

      # Build everything affected except mobile: `mobile:build` shells out to
      # the EAS CLI, which isn't available (or configured) in CI. Web/API/
      # marketing builds are what gate deploys.
      - run: pnpm nx affected -t build --base=$NX_BASE --head=$NX_HEAD --parallel=3 --exclude=mobile
