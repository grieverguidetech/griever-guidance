name: Deploy

# Continuous deployment: runs only after CI succeeds for a push to main, and
# deploys exactly the commit CI tested. `workflow_dispatch` re-deploys main by
# hand (e.g. after a Cloudflare outage) — it skips the CI gate, so use it only
# for a commit CI already passed.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

# Never run two deploys at once, and never cancel one halfway through.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  gate:
    name: CI passed on a push to main
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    steps:
      - run: echo "Deploying ${{ env.DEPLOY_SHA }}"

  # Fails closed before anything ships: with the accounts flag on, the web
  # build needs the Clerk publishable key (pk_) and the Worker needs the Clerk
  # issuer (https). A secret key (sk_) is refused because the publishable key
  # is baked into public JS. Values are never printed; only variable names are.
  check-accounts-config:
    name: Check accounts config
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Check FEATURE_AUTH, CLERK_PUBLISHABLE_KEY and CLERK_ISSUER
        run: |
          if [ "$FEATURE_SHARING" = "true" ] && [ "$FEATURE_AUTH" != "true" ]; then
            echo "::error::FEATURE_SHARING is true but FEATURE_AUTH is not. Sharing needs accounts, so turn FEATURE_AUTH on first or set FEATURE_SHARING back."
            exit 1
          fi
          # A secret key is refused whatever the flag says: the publishable key is baked into public JS.
          case "$CLERK_PUBLISHABLE_KEY" in
            sk_*)
              echo "::error::CLERK_PUBLISHABLE_KEY looks like a secret key (sk_). Use the publishable key (pk_)."; exit 1 ;;
          esac
          if [ "$FEATURE_AUTH" = "true" ]; then
            missing=""
            [ -n "$CLERK_PUBLISHABLE_KEY" ] || missing="$missing CLERK_PUBLISHABLE_KEY"
            [ -n "$CLERK_ISSUER" ] || missing="$missing CLERK_ISSUER"
            if [ -n "$missing" ]; then
              echo "::error::FEATURE_AUTH is true but these repo variables are empty:$missing"
              exit 1
            fi
            case "$CLERK_PUBLISHABLE_KEY" in
              pk_test_*)
                echo "::warning::CLERK_PUBLISHABLE_KEY is a test (development) key" ;;
              pk_*) ;;
              *)
                echo "::error::CLERK_PUBLISHABLE_KEY must start with pk_"; exit 1 ;;
            esac
            case "$CLERK_ISSUER" in
              https://?*) ;;
              *)
                echo "::error::CLERK_ISSUER must start with https://"; exit 1 ;;
            esac
          fi
          echo "Accounts config ok (FEATURE_AUTH=${FEATURE_AUTH:-unset})"
        env:
          FEATURE_AUTH: ${{ vars.FEATURE_AUTH }}
          FEATURE_SHARING: ${{ vars.FEATURE_SHARING }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          CLERK_ISSUER: ${{ vars.CLERK_ISSUER }}

  deploy-gateway:
    name: Deploy Gateway → Cloudflare Workers
    needs: [gate, check-accounts-config]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm nx run-many -t build -p shared --parallel=3

      # CLERK_ISSUER and DATA_FUNCTION_URL are public repo variables. Empty ones are
      # not passed, so the wrangler.toml defaults (and a 503 on /me/*) stay.
      - name: Deploy the Worker
        run: |
          args=()
          if [ -n "$CLERK_ISSUER" ]; then args+=(--var "CLERK_ISSUER:$CLERK_ISSUER"); fi
          # The data function URL is only known after the AWS deploy (docs/aws-data-function.md).
          # Unset means the wrangler.toml default (empty), and the gateway answers 503 for /me/*.
          if [ -n "$DATA_FUNCTION_URL" ]; then args+=(--var "DATA_FUNCTION_URL:$DATA_FUNCTION_URL"); fi
          pnpm exec wrangler deploy --config apps/gateway/wrangler.toml "${args[@]}"
        env:
          CLERK_ISSUER: ${{ vars.CLERK_ISSUER }}
          DATA_FUNCTION_URL: ${{ vars.DATA_FUNCTION_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # RESEND_API_KEY is a Worker secret, not a var. Skipped when the GitHub
      # secret is empty; a key already on the Worker stays. To remove it:
      # wrangler secret delete RESEND_API_KEY --config apps/gateway/wrangler.toml
      # The value goes in through env and stdin only; never echoed, never on a
      # command line. `secret list` prints names only.
      - name: Set the Worker secret RESEND_API_KEY
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::notice::RESEND_API_KEY is empty; skipped. A key already on the Worker stays. To remove it: wrangler secret delete RESEND_API_KEY --config apps/gateway/wrangler.toml"
            exit 0
          fi
          printf '%s' "$RESEND_API_KEY" | pnpm exec wrangler secret put RESEND_API_KEY --config apps/gateway/wrangler.toml
          names=$(pnpm exec wrangler secret list --config apps/gateway/wrangler.toml)
          if ! printf '%s' "$names" | grep -q '"RESEND_API_KEY"'; then
            echo "::error::RESEND_API_KEY is not listed on the Worker after the put"
            exit 1
          fi
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The data function key pair is two Worker secrets, set like RESEND_API_KEY.
      # Skipped when either GitHub secret is empty; keys already on the Worker stay.
      # Both go in through env and stdin only; never echoed. Rotation: docs/aws-data-function.md.
      - name: Set the Worker secrets DATA_FUNCTION_ACCESS_KEY_ID and DATA_FUNCTION_SECRET_ACCESS_KEY
        run: |
          if [ -z "$DATA_FUNCTION_ACCESS_KEY_ID" ] || [ -z "$DATA_FUNCTION_SECRET_ACCESS_KEY" ]; then
            echo "::notice::DATA_FUNCTION_ACCESS_KEY_ID or DATA_FUNCTION_SECRET_ACCESS_KEY is empty; both skipped. Keys already on the Worker stay."
            exit 0
          fi
          # One call, so the key id and the secret can never end up from different keys.
          # Values come from env (jq), never from argv; `secret bulk` reads the JSON from stdin.
          jq -n '{DATA_FUNCTION_ACCESS_KEY_ID: env.DATA_FUNCTION_ACCESS_KEY_ID, DATA_FUNCTION_SECRET_ACCESS_KEY: env.DATA_FUNCTION_SECRET_ACCESS_KEY}' \
            | pnpm exec wrangler secret bulk --config apps/gateway/wrangler.toml
          names=$(pnpm exec wrangler secret list --config apps/gateway/wrangler.toml)
          for name in DATA_FUNCTION_ACCESS_KEY_ID DATA_FUNCTION_SECRET_ACCESS_KEY; do
            if ! printf '%s' "$names" | grep -q "\"$name\""; then
              echo "::error::$name is not listed on the Worker after the put"
              exit 1
            fi
          done
        env:
          DATA_FUNCTION_ACCESS_KEY_ID: ${{ secrets.DATA_FUNCTION_ACCESS_KEY_ID }}
          DATA_FUNCTION_SECRET_ACCESS_KEY: ${{ secrets.DATA_FUNCTION_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Account delete (#327): CLERK_WEBHOOK_SECRET verifies the Clerk webhook; DATA_FUNCTION_SERVICE_SECRET
      # is the second lock on the data function's delete path. Both are Worker secrets set like the keys above.
      # Each is skipped when its GitHub secret is empty; a value already on the Worker stays.
      - name: Set the Worker secrets CLERK_WEBHOOK_SECRET and DATA_FUNCTION_SERVICE_SECRET
        run: |
          for name in CLERK_WEBHOOK_SECRET DATA_FUNCTION_SERVICE_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::notice::$name is empty; skipped. A value already on the Worker stays."
              continue
            fi
            # Value goes in through env and stdin only; never echoed.
            printf '%s' "${!name}" | pnpm exec wrangler secret put "$name" --config apps/gateway/wrangler.toml
          done
        env:
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          DATA_FUNCTION_SERVICE_SECRET: ${{ secrets.DATA_FUNCTION_SERVICE_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-web:
    name: Deploy Web → Cloudflare Pages
    needs: [gate, check-accounts-config]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm nx run-many -t build -p shared hooks api-client data-local data-sync --parallel=3

      - run: pnpm nx build web
        env:
          VITE_API_URL: https://api.grieversguidance.com
          # Accounts stay off unless the repo variable FEATURE_AUTH is "true".
          VITE_FEATURE_AUTH: ${{ vars.FEATURE_AUTH }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          # Sharing stays off unless the repo variable FEATURE_SHARING is "true".
          VITE_FEATURE_SHARING: ${{ vars.FEATURE_SHARING }}
          # Paywall stays off unless the repo variable FEATURE_PAYMENTS is "true".
          VITE_FEATURE_PAYMENTS: ${{ vars.FEATURE_PAYMENTS }}
          # The web editor stays off unless the repo variable FEATURE_CMS is "true".
          VITE_FEATURE_CMS: ${{ vars.FEATURE_CMS }}

      - run: pnpm exec wrangler pages project create griever-guidance-web --production-branch main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - run: pnpm exec wrangler pages deploy apps/web/dist --project-name griever-guidance-web --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-marketing:
    name: Deploy Marketing → Cloudflare Pages
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm nx run-many -t build -p shared --parallel=3

      - run: pnpm nx build marketing
        env:
          PUBLIC_WEB_URL: https://web.grieversguidance.com/

      - run: pnpm exec wrangler pages project create griever-guidance-marketing --production-branch main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - run: pnpm exec wrangler pages deploy apps/marketing/dist --project-name griever-guidance-marketing --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  smoke:
    name: Smoke-test production
    needs: [deploy-gateway, deploy-web, deploy-marketing]
    runs-on: ubuntu-latest
    steps:
      # Asserts on the body, not just the status: a 200 from an error page
      # or a parked domain would otherwise pass.
      - name: Gateway /health
        run: curl -fsS --retry 5 --retry-delay 10 --retry-all-errors https://api.grieversguidance.com/health | grep -q '"ok":true'
      - name: Web app serves the app shell
        run: curl -fsS --retry 5 --retry-delay 10 --retry-all-errors https://web.grieversguidance.com/ | grep -q 'id="root"'
      - name: Marketing site responds
        run: curl -fsS --retry 5 --retry-delay 10 --retry-all-errors -o /dev/null https://grieversguidance.com/
      # With Clerk configured the gateway must reject a tokenless request
      # (401), not answer 503 "not configured". Profile routes use Clerk since #280.
      - name: Gateway /me/profile rejects a missing token
        if: vars.CLERK_ISSUER != ''
        run: |
          code=000
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://api.grieversguidance.com/me/profile || true)
            [ "$code" = "401" ] && exit 0
            sleep 10
          done
          echo "::error::GET /me/profile without a token returned $code, expected 401"
          exit 1
      # Same check for the invite route: a tokenless POST must be refused (401),
      # not answer 404 (route missing) or 503.
      - name: Gateway POST /invites rejects a missing token
        if: vars.CLERK_ISSUER != ''
        run: |
          code=000
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST https://api.grieversguidance.com/invites || true)
            [ "$code" = "401" ] && exit 0
            sleep 10
          done
          echo "::error::POST /invites without a token returned $code, expected 401"
          exit 1
