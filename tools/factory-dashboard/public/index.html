<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory dashboard</title>
<style>
:root {
  --bg: #f7f7f5; --card: #ffffff; --text: #1f2328; --muted: #59636e; --border: #d1d9e0;
  --green: #1a7f37; --red: #cf222e; --amber: #9a6700; --grey: #6e7781; --link: #0550ae; --focus: #0969da;
  /* Chart tokens: categorical slots 1-5 of the dataviz reference palette, validated on --card. */
  --chart-1: #2a78d6; --chart-2: #1baf7a; --chart-3: #eb6834; --chart-4: #6250d6; --chart-5: #e87ba4; --chart-on: #ffffff;
  --chart-axis: #c3c2b7; --chart-track: #eceae4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117; --card: #161b22; --text: #e6edf3; --muted: #9198a1; --border: #30363d;
    --green: #3fb950; --red: #ff7b72; --amber: #d29922; --grey: #8b949e; --link: #79c0ff; --focus: #58a6ff;
    --chart-1: #3987e5; --chart-2: #199e70; --chart-3: #d95926; --chart-4: #9085e9; --chart-5: #d55181; --chart-on: #ffffff;
    --chart-axis: #383835; --chart-track: #21262d;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--card); }
h1 { font-size: 18px; margin: 0 auto 0 0; }
main { max-width: 1200px; margin: 0 auto; padding: 8px 16px 48px; }
section { margin-top: 20px; }
h2 { font-size: 16px; margin: 0 0 8px; }
a { color: var(--link); }
a:focus-visible, button:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
button, select { font: inherit; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); color: var(--text); }
button { cursor: pointer; }
header button { min-height: 44px; min-width: 44px; }
button[aria-disabled="true"] { cursor: not-allowed; opacity: 0.6; border-style: dashed; }
#restart-note[hidden] { display: none; }
ul.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
ul.list li { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; overflow-wrap: anywhere; }
.muted { color: var(--muted); }
.tag.overdue { color: var(--red); border-color: var(--red); border-width: 2px; font-weight: 600; }
.decision { overflow-wrap: anywhere; }
.tag { display: inline-block; font-size: 12px; border: 1px solid var(--border); border-radius: 10px; padding: 0 7px; margin-right: 6px; color: var(--muted); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; background: var(--grey); }
.dot.green { background: var(--green); } .dot.red { background: var(--red); } .dot.amber { background: var(--amber); }
.error { border-left: 4px solid var(--red); padding: 6px 10px; background: var(--card); }
.columns { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.column h3 { font-size: 14px; margin: 0 0 6px; }
details summary { cursor: pointer; }
table.review { width: 100%; border-collapse: collapse; background: var(--card); }
table.review th, table.review td { text-align: left; vertical-align: top; padding: 8px 10px; border: 1px solid var(--border); overflow-wrap: anywhere; }
table.review th.wide, table.review td.wide { width: 36%; font-size: 16px; }
table.review td.narrow { white-space: nowrap; width: 1%; }
[role="tablist"] { display: flex; gap: 4px; padding: 8px 16px 0; border-bottom: 1px solid var(--border); background: var(--card); }
[role="tab"] { border-radius: 6px 6px 0 0; margin-bottom: -1px; }
[role="tab"] { min-height: 44px; border-bottom: 3px solid transparent; }
[role="tab"][aria-selected="true"] { font-weight: 600; background: var(--bg); border-bottom-color: var(--focus); }
[role="tab"]:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[role="tabpanel"]:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
table.plain { border-collapse: collapse; background: var(--card); }
table.plain th, table.plain td { text-align: left; padding: 6px 10px; border: 1px solid var(--border); }
table.plain td.num { text-align: right; }
/* ---- Layout kit ---- */
.grid { display: grid; gap: 12px; align-items: start; grid-template-columns: 1fr; }
@media (min-width: 700px) { .grid.cols-2, .grid.cols-3 { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1000px) { .grid.cols-3 { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 480px) { .grid.kpis { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 900px) { .grid.kpis { grid-template-columns: repeat(4, 1fr); } }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; min-width: 0; }
.grid.kpis { align-items: stretch; }
.card > h3 { font-size: 14px; margin: 0 0 8px; }
.kpi { display: flex; flex-direction: column; gap: 2px; }
.kpi .label { font-size: 13px; color: var(--muted); }
.kpi .value { font-size: 32px; font-weight: 600; line-height: 1.1; }
.kpi.hero .value { font-size: 48px; }
.kpi .note { font-size: 13px; color: var(--muted); }
.kpi svg { margin-top: 4px; }
.more > summary { color: var(--link); margin: 6px 0 4px; }
details > summary { min-height: 24px; padding: 4px 0; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0 0 10px; padding: 0; list-style: none; font-size: 13px; color: var(--muted); }
.swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: middle; }
.chart-row { display: grid; grid-template-columns: minmax(70px, 22%) 1fr 3.5em; gap: 8px; align-items: center; margin: 8px 0; font-size: 13px; }
.chart-row .total { text-align: right; }
.chart-row svg { display: block; width: 100%; overflow: visible; }
.chart:focus-visible, svg.chart:focus-visible, svg.strip:focus-visible, .scroll:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.chart [data-mark]:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
.chart [data-mark]:hover { opacity: 0.8; }
.tip { position: fixed; z-index: 10; pointer-events: none; background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 13px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); max-width: 260px; }
.tip strong { display: block; font-size: 15px; }
.tip span { color: var(--muted); }
.chart-table { margin-top: 8px; }
.scroll { overflow-x: auto; max-width: 100%; }
.spark { margin-top: 4px; }
.item-summary { color: var(--muted); font-size: 13px; }
.grid.spaced { margin-top: 12px; }
.pager { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 8px; }
.pager button { min-height: 44px; min-width: 44px; }
.pager button:disabled { opacity: 0.5; cursor: default; }
.pager-status { color: var(--muted); font-size: 13px; }
.pr-group h3 { font-size: 14px; margin: 12px 0 6px; }
.pr-group h3:first-child { margin-top: 0; }
.lower { margin-top: 8px; }
svg.key { margin-right: 6px; vertical-align: middle; }
.lower > summary { font-weight: 600; }
svg.strip { display: block; width: 100%; height: auto; max-height: 56px; overflow: visible; }
.strip-ends { display: flex; justify-content: space-between; font-size: 13px; margin-top: 2px; }
.pr-summary { color: var(--muted); font-size: 13px; }
ul.flags { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px 12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Factory dashboard</h1>
  <span id="updated" class="muted" role="status">Loading</span>
  <label id="area-label">Area <select id="area"><option value="all">All areas</option></select></label>
  <button id="refresh" type="button">Refresh</button>
  <button id="restart" type="button" hidden>Restart dashboard</button>
  <span id="restart-note" class="muted" role="status" hidden></span>
</header>
<div role="tablist" aria-label="Dashboard views" id="tabs">
  <button role="tab" type="button" id="tab-product" aria-controls="panel-product" data-tab="product">Product</button>
  <button role="tab" type="button" id="tab-engineering" aria-controls="panel-engineering" data-tab="engineering">Engineering</button>
  <button role="tab" type="button" id="tab-business" aria-controls="panel-business" data-tab="business">Business</button>
</div>
<main id="main">
  <div role="tabpanel" id="panel-product" aria-labelledby="tab-product" tabindex="0" hidden></div>
  <div role="tabpanel" id="panel-engineering" aria-labelledby="tab-engineering" tabindex="0" hidden></div>
  <div role="tabpanel" id="panel-business" aria-labelledby="tab-business" tabindex="0" hidden></div>
</main>
<script>
"use strict";
var state = null;
var TABS = ["product", "engineering", "business"];
var main = document.getElementById("panel-engineering");
var areaSelect = document.getElementById("area");

function el(tag, text, className) {
  var node = document.createElement(tag);
  if (text !== undefined && text !== null) {
    node.textContent = text;
  }
  if (className) {
    node.className = className;
  }
  return node;
}

// Only https URLs become links. Anything else is plain text.
function link(text, url) {
  if (typeof url !== "string" || !/^https:\/\//.test(url)) {
    return el("span", text);
  }
  var a = el("a", text);
  a.href = url;
  a.target = "_blank";
  a.rel = "noreferrer noopener";
  return a;
}

function areaOf(labels) {
  var found = (labels || []).filter(function (n) {
    return n.indexOf("area:") === 0;
  })[0];
  return found ? found.slice(5) : "none";
}

function visible(item) {
  var chosen = areaSelect.value;
  return chosen === "all" || areaOf(item.labels) === chosen;
}

function couldNotCheck(s, failed) {
  s.appendChild(el("p", "Could not check: " + failed.join(", ") + " failed to load.", "error"));
}

function listOf(items, build, emptyText) {
  if (items.length === 0) {
    return el("p", emptyText, "muted");
  }
  var ul = el("ul", null, "list");
  items.forEach(function (item) {
    var li = el("li");
    build(li, item);
    ul.appendChild(li);
  });
  return ul;
}

function ciDot(ci) {
  var map = {
    green: ["green", "Checks passing"],
    red: ["red", "Checks failing"],
    pending: ["amber", "Checks running"],
    none: ["grey", "No checks"]
  };
  var pair = map[ci] || map.none;
  var span = el("span");
  var dot = el("span", null, "dot " + pair[0]);
  dot.setAttribute("aria-hidden", "true");
  span.appendChild(dot);
  span.appendChild(document.createTextNode(pair[1]));
  return span;
}

function runDot(run) {
  var result = "none";
  if (run.status !== "completed") {
    result = "pending";
  } else if (run.conclusion === "success") {
    result = "green";
  } else if (run.conclusion === "failure") {
    result = "red";
  }
  return ciDot(result);
}

function itemText(item) {
  return (item.number ? "#" + item.number + " " : "") + item.title;
}

function when(iso) {
  var date = new Date(iso);
  return isNaN(date.getTime()) ? "Unknown time" : date.toLocaleString();
}

// ---- Engineering tab ----
// One-line summaries for PRs come from the linked issue, which the page already has on the board, needs-you and drift lists.
function summaryIndex() {
  var index = {};
  var lists = [state.board.items, state.needsYou || [], state.drift || []];
  lists.forEach(function (items) {
    items.forEach(function (item) {
      if (item.number && item.summary && !index[item.number]) {
        index[item.number] = item.summary;
      }
    });
  });
  return index;
}

function sourceFailed(key) {
  return !!state.sources[key] && !state.sources[key].ok;
}

// A <details> that starts closed. When its source failed, the failure shows in the summary and inside.
function lowerSection(parent, title, key) {
  var d = el("details", null, "card lower");
  var src = state.sources[key];
  var failed = !!src && !src.ok;
  d.appendChild(el("summary", title + (failed ? " (could not load)" : "")));
  if (failed) {
    d.appendChild(el("p", "Could not load: " + src.error, "error"));
  }
  parent.appendChild(d);
  return d;
}

function renderNeedsYou(parent) {
  var s = kitSection(parent, "Needs you", "prs");
  var labels = { "pr-green": "Ready for G2", blocked: "Blocked", "ready-for-human": "Ready for human" };
  if (state.needsYou === null) {
    couldNotCheck(s, state.needsYouBlockedBy);
    return;
  }
  var items = state.needsYou.filter(visible);
  if (items.length === 0) {
    s.appendChild(el("p", "Nothing waits for you.", "muted"));
    return;
  }
  s.appendChild(paged("needs-you", "items that need you", items, function (pageItems) {
    var g = grid("cols-2");
    pageItems.forEach(function (item) {
      var c = card();
      var line = el("div");
      line.appendChild(el("span", labels[item.kind], "tag"));
      line.appendChild(link("#" + item.number + " " + item.title, item.url));
      c.appendChild(line);
      c.appendChild(summaryLine(item));
      g.appendChild(c);
    });
    return g;
  }));
}

// Pass-rate bands: 90% and up is Healthy, 70% to 89% is Watch, below 70% is Failing.
function passStatus(percent) {
  if (percent >= 90) {
    return "Healthy";
  }
  return percent >= 70 ? "Watch" : "Failing";
}

function ciTile() {
  var h = state.engineering.ciHealth;
  if (!h) {
    return kpiTile("CI pass rate on main", null, "Status unknown: could not load");
  }
  if (h.passPercent === null) {
    return kpiTile("CI pass rate on main", "None", "No finished runs");
  }
  var status = h.counted < 10 ? "Too few runs to judge" : passStatus(h.passPercent);
  var note = status + ": " + h.passed + " of " + h.counted + " finished runs passed";
  return kpiTile("CI pass rate on main", h.passPercent + "%", note);
}

function deployStatus(deploys) {
  var latest = deploys.recent[0];
  if (!latest) {
    return "No deploy runs";
  }
  if (latest.status !== "completed") {
    return "Latest deploy is running";
  }
  if (latest.conclusion === "success") {
    return "Latest deploy succeeded";
  }
  if (latest.conclusion === "skipped" || latest.conclusion === "cancelled") {
    return "Latest deploy was " + latest.conclusion;
  }
  return "Latest deploy did not succeed (" + latest.conclusion + ")";
}

function deployTile() {
  var d = state.engineering.deploys;
  var label = "Since last good deploy";
  if (!d) {
    return kpiTile(label, null, "Status unknown: could not load");
  }
  if (!d.lastGood) {
    return kpiTile(label, "None", "No successful deploy in the runs checked");
  }
  return kpiTile(label, d.sinceGoodText, deployStatus(d));
}

function flakyTile() {
  var items = state.engineering.flaky;
  if (!items) {
    return kpiTile("Flaky tests open", null, "Status unknown: could not load");
  }
  var count = items.filter(visible).length;
  return kpiTile("Flaky tests open", count, count === 0 ? "None open" : "Needs attention");
}

function prTile() {
  if (sourceFailed("prs")) {
    return kpiTile("Open PRs", null, "Status unknown: could not load");
  }
  var prs = state.prs.filter(visible);
  var failing = prs.filter(function (pr) {
    return pr.ci === "red";
  }).length;
  var note = "No open PRs";
  if (prs.length > 0) {
    note = failing === 0 ? "No failing checks" : failing + " with failing checks";
  }
  return kpiTile("Open PRs", prs.length, note);
}

function renderHealthStrip(parent) {
  var s = el("section");
  s.appendChild(el("h2", "Health", "sr-only"));
  var g = grid("kpis");
  g.appendChild(ciTile());
  g.appendChild(deployTile());
  g.appendChild(flakyTile());
  g.appendChild(prTile());
  s.appendChild(g);
  parent.appendChild(s);
}

function renderPrs(parent) {
  var s = kitSection(parent, "Open PRs and their CI", "prs");
  var summaries = summaryIndex();
  var c = card();
  c.appendChild(pagedList("open-prs", "open PRs", state.prs.filter(visible), function (li, pr) {
    li.appendChild(ciDot(pr.ci));
    li.appendChild(document.createTextNode(" "));
    if (pr.isDraft) {
      li.appendChild(el("span", "Draft", "tag"));
    }
    li.appendChild(link("#" + pr.number + " " + pr.title, pr.url));
    var issue = pr.issueNumber ? " (issue #" + pr.issueNumber + ")" : "";
    li.appendChild(el("div", pr.headRefName + issue, "muted"));
    li.appendChild(summaryLine({ summary: pr.summary || (pr.issueNumber ? summaries[pr.issueNumber] : "") }));
  }, "No open PRs."));
  s.appendChild(c);
}

// A strip of one mark per CI run on main, oldest at the left. Pass is a green block, fail is a red block with a cross,
// ignored is a short grey block, so the result never depends on color alone. One tab stop, arrow keys between runs.
// The legend key repeats the shape of the mark: a block, a block with a cross, a short block.
function legendKey(result) {
  var key = svgEl("svg", { width: 12, height: 14, viewBox: "0 0 12 14" });
  key.setAttribute("class", "key");
  key.setAttribute("aria-hidden", "true");
  var fill = { pass: "var(--green)", fail: "var(--red)", ignored: "var(--grey)" }[result];
  if (result === "ignored") {
    key.appendChild(svgEl("rect", { x: 0, y: 4, width: 12, height: 6, rx: 1.5, fill: fill }));
  } else {
    key.appendChild(svgEl("rect", { x: 0, y: 0, width: 12, height: 14, rx: 2, fill: fill }));
  }
  if (result === "fail") {
    key.appendChild(svgEl("path", { d: "M3 4 L9 10 M9 4 L3 10", stroke: "var(--card)", "stroke-width": 2, "stroke-linecap": "round", fill: "none" }));
  }
  return key;
}

function runStripChart(marks, caption, labelId) {
  var wrap = el("div", null, "chart");
  var counts = { pass: 0, fail: 0, ignored: 0 };
  marks.forEach(function (mark) {
    counts[mark.result] += 1;
  });
  var legend = el("ul", null, "legend");
  [["pass", "Passed"], ["fail", "Failed"], ["ignored", "Ignored"]].forEach(function (entry) {
    var li = el("li");
    li.appendChild(legendKey(entry[0]));
    li.appendChild(document.createTextNode(entry[1] + " (" + counts[entry[0]] + ")"));
    legend.appendChild(li);
  });
  wrap.appendChild(legend);
  var step = 14;
  var svg = svgEl("svg", { viewBox: "0 0 " + (marks.length * step) + " 40", width: "100%" });
  svg.setAttribute("class", "strip");
  var colors = { pass: "var(--green)", fail: "var(--red)", ignored: "var(--grey)" };
  marks.forEach(function (mark, index) {
    var x = index * step;
    var g = svgEl("g");
    if (mark.result === "ignored") {
      g.appendChild(svgEl("rect", { x: x, y: 15, width: 10, height: 10, rx: 2, fill: colors.ignored }));
    } else {
      g.appendChild(svgEl("rect", { x: x, y: 4, width: 10, height: 32, rx: 2, fill: colors[mark.result] }));
    }
    if (mark.result === "fail") {
      g.appendChild(svgEl("path", { d: "M" + (x + 2) + " 15 L" + (x + 8) + " 25 M" + (x + 8) + " 15 L" + (x + 2) + " 25", stroke: "var(--card)", "stroke-width": 2.5, "stroke-linecap": "round", fill: "none" }));
    }
    markInteractive(g, mark.text, when(mark.createdAt) + ", run " + (index + 1) + " of " + marks.length);
    svg.appendChild(g);
  });
  chartGroup(svg, labelId);
  wrap.appendChild(svg);
  var ends = el("div", null, "strip-ends muted");
  ends.appendChild(el("span", "Oldest"));
  ends.appendChild(el("span", "Newest"));
  wrap.appendChild(ends);
  wrap.appendChild(chartTable(caption, ["Started", "Result", "Run"], marks.map(function (mark) {
    return [when(mark.createdAt), mark.text, { text: "Run " + mark.id, url: mark.url }];
  })));
  return wrap;
}

function throughputCard() {
  var c = card("PRs merged per week");
  var t = state.engineering.throughput;
  if (!t) {
    c.appendChild(el("p", "Could not load: " + state.sources.mergedPrs.error, "error"));
    return c;
  }
  if (state.engineering.throughputMayBeCutOff) {
    c.appendChild(el("p", "May be cut off: the list reached its limit.", "error"));
  }
  c.appendChild(barChart(t.weeks.map(function (week) {
    return { label: week.label, value: week.count };
  }), "PRs merged", "PRs merged per week, last 4 weeks", c.titleId, "Week"));
  var median = t.medianHours === null ? "Median time from opened to merged: Unknown (no merged PRs to measure)." : "Median time from opened to merged: " + t.medianText + ".";
  c.appendChild(el("p", median, "muted"));
  return c;
}

function ciRunsCard() {
  var c = card("CI results, last 30 runs on main");
  var h = state.engineering.ciHealth;
  if (!h) {
    c.appendChild(el("p", "Could not load: " + state.sources.ciMain.error, "error"));
    return c;
  }
  if (h.strip.length === 0) {
    c.appendChild(el("p", "No CI runs on main.", "muted"));
    return c;
  }
  c.appendChild(runStripChart(h.strip, "CI results of the last " + h.strip.length + " runs on main, oldest first", c.titleId));
  var p = el("p", null, "muted");
  if (h.lastFailure) {
    p.appendChild(document.createTextNode("Last failure: "));
    p.appendChild(link(when(h.lastFailure.createdAt) + " (" + h.lastFailure.conclusion + ")", h.lastFailure.url));
  } else {
    p.appendChild(document.createTextNode("No failures in these runs."));
  }
  c.appendChild(p);
  return c;
}

function renderCharts(parent) {
  var s = kitSection(parent, "Trends", null);
  var g = grid("cols-2");
  g.appendChild(throughputCard());
  g.appendChild(ciRunsCard());
  s.appendChild(g);
}

function boardList(items, key, label) {
  return pagedList(key, label, items, function (li, item) {
    li.appendChild(link(itemText(item), item.url));
    li.appendChild(summaryLine(item));
  }, "Empty.");
}

function renderBoard(parent) {
  var s = kitSection(parent, "Board (open issues only)", "board");
  if (state.boardTruncated) {
    var note = "Board truncated: showing " + state.boardTruncated.shown + " of " + state.boardTruncated.total;
    s.appendChild(el("p", note, "error"));
  }
  var byStatus = function (status) {
    return (state.board.groups[status] || []).filter(visible);
  };
  var chosen = areaSelect.value;
  var stacks = state.engineering.boardStacks || [];
  var stack = stacks.filter(function (candidate) {
    return candidate.area === chosen;
  })[0];
  var top = card("Open issues with a board status");
  if (!stack || stack.total === 0) {
    top.appendChild(el("p", "No open issues with a board status.", "muted"));
  } else {
    var names = stack.segments.map(function (seg) {
      return seg.name;
    });
    var rowLabel = chosen === "all" ? "All areas" : chosen;
    top.appendChild(stackedBarChart([{ label: rowLabel, total: stack.total, segments: stack.segments }], names, "Open issues with a board status", top.titleId));
  }
  top.appendChild(el("p", "No status: " + (stack ? stack.noStatus : byStatus("No status").length) + ". Done is listed below and not in the bar.", "muted"));
  s.appendChild(top);
  var g = grid("cols-3");
  g.className += " spaced";
  ["Ready", "In progress", "In review", "Blocked", "Backlog", "No status"].forEach(function (status) {
    var items = byStatus(status);
    var c = card(status + " (" + items.length + ")");
    c.appendChild(boardList(items, "board-" + status, status + " issues"));
    g.appendChild(c);
  });
  s.appendChild(g);
  var done = byStatus("Done");
  var d = el("details", null, "more");

}

  }

  var c = card();

// ---- Layout kit (everything is built with textContent and createElementNS) ----
var SVG_NS = "http://www.w3.org/2000/svg";
var PAGE_SIZE = 10;
var BAR_H = 18;
var pageOf = {};
var idCounter = 0;

function nextId(prefix) {
  idCounter += 1;
  return prefix + "-" + idCounter;
}

function svgEl(tag, attrs) {
  var node = document.createElementNS(SVG_NS, tag);
  Object.keys(attrs || {}).forEach(function (name) {
    node.setAttribute(name, String(attrs[name]));
  });
  return node;
}

function grid(kind) {
  return el("div", null, "grid " + kind);
}

// A card with an optional h3. The h3 gets an id so a chart inside can name itself with aria-labelledby.
function card(title) {
  var c = el("div", null, "card");
  if (title) {
    var h = el("h3", title);
    h.id = nextId("h");
    c.appendChild(h);
    c.titleId = h.id;
  }
  return c;
}

// A section with an h2 and the source error (if any).
function kitSection(parent, title, key) {
  var s = el("section");
  s.appendChild(el("h2", title));
  var src = state.sources[key];
  if (src && !src.ok) {
    s.appendChild(el("p", "Could not load: " + src.error, "error"));
  }
  parent.appendChild(s);
  return s;
}

// A one-line summary under an item title. Nothing is drawn when there is none.
function summaryLine(item) {
  if (item && item.summary) {
    return el("div", item.summary, "item-summary");
  }
  return document.createDocumentFragment();
}

// For lists that are short by nature: the first `limit` items, the rest in a closed <details>.
function withShowMore(items, limit, build, emptyText, noun) {
  if (items.length <= limit) {
    return listOf(items, build, emptyText);
  }
  var wrap = el("div");
  wrap.appendChild(listOf(items.slice(0, limit), build, emptyText));
  var more = el("details", null, "more");
  more.appendChild(el("summary", "Show " + (items.length - limit) + " more " + noun));
  more.appendChild(listOf(items.slice(limit), build, emptyText));
  wrap.appendChild(more);
  return wrap;
}

// Pagination for long lists: 10 per page, real Previous and Next buttons, "Showing 11-20 of 54" announced politely.
// renderPage(pageItems) returns the node for one page. Lists of 10 or fewer are drawn as they are.
function paged(key, label, items, renderPage) {
  if (items.length <= PAGE_SIZE) {
    return renderPage(items);
  }
  var wrap = el("div", null, "paged");
  var body = el("div");
  var bar = el("div", null, "pager");
  var prev = el("button", "Previous");
  var next = el("button", "Next");
  var status = el("span", null, "pager-status");
  prev.type = "button";
  next.type = "button";
  prev.setAttribute("aria-label", "Previous page, " + label);
  next.setAttribute("aria-label", "Next page, " + label);
  status.setAttribute("role", "status");
  status.setAttribute("aria-live", "polite");
  function show() {
    var pages = Math.ceil(items.length / PAGE_SIZE);
    var page = Math.min(pageOf[key] || 0, pages - 1);
    pageOf[key] = page;
    var start = page * PAGE_SIZE;
    var end = Math.min(start + PAGE_SIZE, items.length);
    body.textContent = "";
    body.appendChild(renderPage(items.slice(start, end)));
    status.textContent = "Showing " + (start + 1) + "-" + end + " of " + items.length;
    prev.disabled = page === 0;
    next.disabled = end >= items.length;
  }
  function go(step, clicked, other) {
    pageOf[key] = (pageOf[key] || 0) + step;
    show();
    if (clicked.disabled) {
      other.focus();
    }
  }
  prev.addEventListener("click", function () {
    go(-1, prev, next);
  });
  next.addEventListener("click", function () {
    go(1, next, prev);
  });
  bar.appendChild(prev);
  bar.appendChild(status);
  bar.appendChild(next);
  wrap.appendChild(body);
  wrap.appendChild(bar);
  show();
  return wrap;
}

function pagedList(key, label, items, build, emptyText) {
  return paged(key, label, items, function (pageItems) {
    return listOf(pageItems, build, emptyText);
  });
}

function kpiTile(label, value, note, hero) {
  var tile = el("div", null, "card kpi" + (hero ? " hero" : ""));
  var name = el("span", label, "label");
  name.id = nextId("k");
  tile.titleId = name.id;
  tile.appendChild(name);
  tile.appendChild(el("span", value === null ? "Unknown" : String(value), "value"));
  if (note) {
    tile.appendChild(el("span", note, "note"));
  }
  return tile;
}

// One shared tooltip. Marks show it on pointer move and on keyboard focus. Escape, pointer leave and blur hide it.
var tip = null;
function showTip(target, value, name, x, y) {
  if (!tip) {
    tip = el("div", null, "tip");
    tip.setAttribute("aria-hidden", "true");
    document.body.appendChild(tip);
  }
  tip.textContent = "";
  tip.appendChild(el("strong", value));
  tip.appendChild(el("span", name));
  tip.hidden = false;
  var box = target.getBoundingClientRect();
  var left = x === null ? box.left + box.width / 2 : x;
  var top = y === null ? box.top : y;
  tip.style.left = Math.min(Math.max(8, left + 12), window.innerWidth - 270) + "px";
  tip.style.top = Math.max(8, top - 52) + "px";
}

function hideTip() {
  if (tip) {
    tip.hidden = true;
  }
}

document.addEventListener("keydown", function (event) {
  if (event.key === "Escape") {
    hideTip();
  }
});

// A mark is reachable with the arrow keys inside its chart (tabindex -1), not as its own tab stop.
function markInteractive(mark, value, name) {
  mark.setAttribute("tabindex", "-1");
  mark.setAttribute("data-mark", "1");
  mark.setAttribute("role", "img");
  mark.setAttribute("aria-label", value + ", " + name);
  mark.addEventListener("pointermove", function (event) {
    showTip(mark, value, name, event.clientX, event.clientY);
  });
  mark.addEventListener("pointerleave", hideTip);
  mark.addEventListener("focus", function () {
    showTip(mark, value, name, null, null);
  });
  mark.addEventListener("blur", hideTip);
}

// One tab stop per chart. Arrow keys, Home and End move between its marks. The tooltip follows focus.
function chartGroup(node, labelId) {
  var hint = el("span", "Use the arrow keys to move between values. Press Escape to hide the tooltip.", "sr-only");
  hint.id = nextId("hint");
  node.appendChild(hint);
  node.setAttribute("tabindex", "0");
  node.setAttribute("role", "group");
  node.setAttribute("aria-labelledby", labelId);
  node.setAttribute("aria-describedby", hint.id);
  node.addEventListener("keydown", function (event) {
    var marks = Array.prototype.slice.call(node.querySelectorAll("[data-mark]"));
    if (marks.length === 0) {
      return;
    }
    var at = marks.indexOf(document.activeElement);
    var to = null;
    if (event.key === "ArrowRight" || event.key === "ArrowDown") {
      to = at < 0 ? 0 : Math.min(at + 1, marks.length - 1);
    } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
      to = at < 0 ? 0 : Math.max(at - 1, 0);
    } else if (event.key === "Home") {
      to = 0;
    } else if (event.key === "End") {
      to = marks.length - 1;
    }
    if (to !== null) {
      event.preventDefault();
      marks[to].focus();
    }
  });
}

// A bar from the left baseline: square at the baseline, 4px round at the data end.
function barShape(widthAttr, fill) {
  var g = svgEl("g");
  g.appendChild(svgEl("rect", { x: 0, y: 0, width: widthAttr, height: BAR_H, rx: 4, fill: fill }));
  g.appendChild(svgEl("rect", { x: 0, y: 0, width: 6, height: BAR_H, fill: fill }));
  return g;
}

// A sideways-scrolling box that a keyboard can reach: a tab stop, a region and a name.
function scrollBox(label) {
  var box = el("div", null, "scroll");
  box.setAttribute("tabindex", "0");
  box.setAttribute("role", "region");
  box.setAttribute("aria-label", label);
  return box;
}

// Runs one part of a tab. A part that throws shows one calm line and the rest of the tab still draws.
function safely(parent, fn) {
  try {
    fn(parent);
  } catch (e) {
    parent.appendChild(el("p", "Could not draw this part.", "error"));
  }
}

// The table twin of a chart. It scrolls sideways inside its own box so a narrow screen never scrolls the page.
function chartTable(caption, headers, rows) {
  var d = el("details", null, "chart-table");
  d.appendChild(el("summary", "Table view"));
  var scroll = scrollBox(caption);
  var table = el("table", null, "plain");
  table.appendChild(el("caption", caption, "sr-only"));
  var head = el("tr");
  headers.forEach(function (name) {
    var th = el("th", name);
    th.scope = "col";
    head.appendChild(th);
  });
  table.appendChild(head);
  rows.forEach(function (cells) {
    var tr = el("tr");
    cells.forEach(function (cell, index) {
      if (index === 0) {
        var th = el("th", String(cell));
        th.scope = "row";
        tr.appendChild(th);
      } else if (cell && typeof cell === "object") {
        var linked = el("td", null, "num");
        linked.appendChild(link(cell.text, cell.url));
        tr.appendChild(linked);
      } else {
        tr.appendChild(el("td", String(cell), "num"));
      }
    });
    table.appendChild(tr);
  });
  scroll.appendChild(table);
  d.appendChild(scroll);
  return d;
}

// Horizontal bars, one series, one baseline. rows: [{ label, value }]. Value sits at the bar tip.
function barChart(rows, unit, caption, labelId, rowName) {
  var wrap = el("div", null, "chart");
  var max = Math.max.apply(null, rows.map(function (r) {
    return r.value;
  }).concat([1]));
  rows.forEach(function (row) {
    var line = el("div", null, "chart-row");
    line.appendChild(el("span", row.label));
    var svg = svgEl("svg", { height: BAR_H, width: "100%" });
    var bar = barShape((row.value / max * 100) + "%", "var(--chart-1)");
    markInteractive(bar, (row.text || row.value) + " " + unit, row.label);
    svg.appendChild(svgEl("line", { x1: 0, x2: 0, y1: 0, y2: BAR_H, stroke: "var(--chart-axis)", "stroke-width": 1 }));
    svg.appendChild(bar);
    line.appendChild(svg);
    line.appendChild(el("span", String(row.text || row.value), "total"));
    wrap.appendChild(line);
  });
  wrap.appendChild(chartTable(caption, [rowName || "Area", unit], rows.map(function (r) {
    return [r.label, r.text || r.value];
  })));
  chartGroup(wrap, labelId);
  return wrap;
}

// Stacked bars, one per row, fixed segment order, 2px surface gap, legend, tooltip, value labels where they fit, table view.
// rows: [{ label, total, segments: [{ name, value }] }]. Series colors follow the order of `names`.
function stackedBarChart(rows, names, caption, labelId) {
  var wrap = el("div", null, "chart");
  var legend = el("ul", null, "legend");
  names.forEach(function (name, index) {
    var li = el("li");
    var sw = el("span", null, "swatch");
    sw.style.background = "var(--chart-" + (index + 1) + ")";
    sw.setAttribute("aria-hidden", "true");
    li.appendChild(sw);
    li.appendChild(document.createTextNode(name));
    legend.appendChild(li);
  });
  wrap.appendChild(legend);
  var max = Math.max.apply(null, rows.map(function (r) {
    return r.total;
  }).concat([1]));
  rows.forEach(function (row) {
    var line = el("div", null, "chart-row");
    line.appendChild(el("span", row.label));
    var svg = svgEl("svg", { height: BAR_H, width: "100%" });
    var scale = row.total / max * 100;
    var at = 0;
    var lastIndex = -1;
    row.segments.forEach(function (seg, index) {
      if (seg.value > 0) {
        lastIndex = index;
      }
    });
    row.segments.forEach(function (seg, index) {
      if (seg.value === 0) {
        return;
      }
      var width = seg.value / row.total * scale;
      var part = svgEl("svg", { x: at + "%", y: 0, width: width + "%", height: BAR_H, overflow: "visible" });
      var fill = "var(--chart-" + (index + 1) + ")";
      part.appendChild(svgEl("rect", { x: 0, y: 0, width: "100%", height: BAR_H, fill: fill, rx: index === lastIndex ? 4 : 0 }));
      if (index === lastIndex && at > 0) {
        part.appendChild(svgEl("rect", { x: 0, y: 0, width: 6, height: BAR_H, fill: fill }));
      }
      if (at > 0) {
        // The 2px gap between touching segments, in the surface color.
        part.appendChild(svgEl("rect", { x: 0, y: 0, width: 2, height: BAR_H, fill: "var(--card)" }));
      }
      part.setAttribute("data-seg", String(seg.value));
      markInteractive(part, seg.value + " " + (seg.value === 1 ? "issue" : "issues"), row.label + ", " + seg.name);
      svg.appendChild(part);
      at += width;
    });
    line.appendChild(svg);
    line.appendChild(el("span", String(row.total), "total"));
    wrap.appendChild(line);
  });
  wrap.appendChild(chartTable(caption, ["Area"].concat(names, ["Total"]), rows.map(function (row) {
    return [row.label].concat(row.segments.map(function (seg) {
      return seg.value;
    }), [row.total]);
  })));
  chartGroup(wrap, labelId);
  return wrap;
}

// Puts the value inside each stacked segment that is wide enough for it. Runs after the page is in the DOM,
// and again on resize and tab change, because widths are only known then.
function fitLabels() {
  Array.prototype.forEach.call(document.querySelectorAll("svg[data-seg]"), function (seg) {
    var old = seg.querySelector("text");
    if (old) {
      seg.removeChild(old);
    }
    var value = seg.getAttribute("data-seg");
    if (seg.getBoundingClientRect().width < value.length * 8 + 16) {
      return;
    }
    var text = svgEl("text", { x: 8, y: 13, fill: "var(--chart-on)", "font-size": 12, "font-weight": 600, "pointer-events": "none" });
    text.textContent = value;
    seg.appendChild(text);
  });
}
window.addEventListener("resize", fitLabels);

// A 7-point line, 2px, with an end dot (surface ring), one tab stop, a mark per point, and a table view.
// points: [{ label, count }]
function sparkline(points, unit, caption, labelId) {
  var wrap = el("div", null, "spark");
  var w = 120;
  var h = 28;
  var values = points.map(function (p) {
    return p.count;
  });
  var max = Math.max.apply(null, values.concat([1]));
  var xs = values.map(function (v, i) {
    return 6 + i * ((w - 12) / Math.max(values.length - 1, 1));
  });
  var ys = values.map(function (v) {
    return h - 6 - v / max * (h - 12);
  });
  var svg = svgEl("svg", { width: w, height: h, viewBox: "0 0 " + w + " " + h });
  svg.setAttribute("class", "chart");
  svg.appendChild(svgEl("polyline", {
    points: xs.map(function (x, i) {
      return x + "," + ys[i];
    }).join(" "),
    fill: "none", stroke: "var(--chart-1)", "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round"
  }));
  svg.appendChild(svgEl("circle", { cx: xs[xs.length - 1], cy: ys[ys.length - 1], r: 4, fill: "var(--chart-1)", stroke: "var(--card)", "stroke-width": 2 }));
  points.forEach(function (p, i) {
    var hit = svgEl("circle", { cx: xs[i], cy: ys[i], r: 9, fill: "transparent" });
    markInteractive(hit, p.count + " " + unit, p.label);
    svg.appendChild(hit);
  });
  chartGroup(svg, labelId);
  wrap.appendChild(svg);
  wrap.appendChild(chartTable(caption, ["Day", unit], points.map(function (p) {
    return [p.label, p.count];
  })));
  return wrap;
}

// ---- Product tab ----
function renderHeadline(parent) {
  var k = state.product.kpis;
  var s = el("section");
  s.appendChild(el("h2", "Headline", "sr-only"));
  var g = grid("kpis");
  g.appendChild(kpiTile("Launch blockers open", k.launchBlockers, k.launchBlockers === 0 ? "Nothing blocks launch" : null, true));
  var shipped = kpiTile("PRs shipped this week", state.sources.mergedPrs.ok ? k.shipped : null, "Last 7 days");
  if (state.sources.mergedPrs.ok) {
    shipped.appendChild(sparkline(k.perDay, "PRs", "PRs merged per day, last 7 days", shipped.titleId));
  }
  g.appendChild(shipped);
  var flagsValue = state.sources.featureFlags.ok ? k.flagsOn + " of " + k.flagsTotal : null;
  g.appendChild(kpiTile("Feature flags on", flagsValue, "Out of all feature flags"));
  g.appendChild(kpiTile("Open issues", k.openIssues, null));
  s.appendChild(g);
  parent.appendChild(s);
}

function renderBlockers(parent) {
  var s = kitSection(parent, "Launch blockers", "openIssues");
  if (state.product.launchBlockers === null) {
    couldNotCheck(s, state.product.blockedBy);
    return;
  }
  var c = card();
  c.appendChild(withShowMore(state.product.launchBlockers, 5, function (li, item) {
    li.appendChild(el("span", item.status, "tag"));
    li.appendChild(el("span", ": ", "sr-only"));
    li.appendChild(link("#" + item.number + " " + item.title, item.url));
    li.appendChild(summaryLine(item));
  }, "Nothing blocks launch.", "launch blockers"));
  s.appendChild(c);
}

function shippedGroups(shipped) {
  var groups = {};
  shipped.forEach(function (pr) {
    (groups[pr.area] = groups[pr.area] || []).push(pr);
  });
  return Object.keys(groups).sort(function (a, b) {
    if (a === "none" || b === "none") {
      return a === "none" ? 1 : -1;
    }
    return groups[b].length - groups[a].length || a.localeCompare(b);
  }).map(function (area) {
    return { area: area, prs: groups[area] };
  });
}

function renderShipped(parent) {
  var s = kitSection(parent, "Shipped this week", "mergedPrs");
  if (!state.sources.mergedPrs.ok) {
    return;
  }
  if (state.product.shippedMayBeCutOff) {
    s.appendChild(el("p", "May be cut off: the list reached its limit.", "error"));
  }
  var shipped = state.product.shipped;
  if (shipped.length === 0) {
    s.appendChild(el("p", "Nothing merged in the last 7 days.", "muted"));
    return;
  }
  var groups = shippedGroups(shipped);
  var chart = card("PRs shipped by area");
  chart.appendChild(barChart(groups.map(function (group) {
    return { label: group.area, value: group.prs.length };
  }), "PRs", "PRs shipped this week by area", chart.titleId));
  s.appendChild(chart);
  var g = grid("cols-2");
  g.className += " spaced";
  groups.forEach(function (group) {
    var c = card(group.area + " (" + group.prs.length + ")");
    c.appendChild(pagedList("ship-" + group.area, group.area + " PRs", group.prs, function (li, pr) {
      li.appendChild(link("#" + pr.number + " " + pr.title, pr.url));
      li.appendChild(el("span", " · " + new Date(pr.mergedAt).toLocaleDateString(), "muted"));
      li.appendChild(summaryLine(pr));
    }, "None."));
    g.appendChild(c);
  });
  s.appendChild(g);
}

var ROADMAP_NAMES = ["Ready", "In progress", "Blocked", "Backlog", "Other"];

function renderRoadmap(parent) {
  var s = kitSection(parent, "Roadmap", "board");
  var stacks = state.product.roadmapStacks;
  if (stacks === null) {
    couldNotCheck(s, state.product.blockedBy);
    return;
  }
  if (stacks.length === 0) {
    s.appendChild(el("p", "No open issues.", "muted"));
    return;
  }
  var c = card("Open issues by area and board status");
  c.appendChild(stackedBarChart(stacks.map(function (stack) {
    return { label: stack.area, total: stack.total, segments: stack.segments };
  }), ROADMAP_NAMES, "Open issues by area and board status", c.titleId));
  c.appendChild(el("p", "Other: In review, Done, and issues with no board status.", "muted"));
  s.appendChild(c);
}

function renderFlags(parent) {
  var s = kitSection(parent, "Feature flags", "featureFlags");
  var flags = state.product.flags;
  if (flags.length === 0) {
    if (state.sources.featureFlags.ok) {
      s.appendChild(el("p", "No feature flags set.", "muted"));
    }
    return;
  }
  var c = card();
  var build = function (li, flag) {
    li.appendChild(el("span", flag.state, "tag"));
    li.appendChild(el("span", ": ", "sr-only"));
    li.appendChild(document.createTextNode(flag.name));
  };
  c.appendChild(withShowMore(flags, 12, build, "No feature flags set.", "feature flags"));
  s.appendChild(c);
  Array.prototype.forEach.call(c.querySelectorAll("ul.list"), function (ul) {
    ul.className = "list flags";
  });
}

function renderProduct() {
  var panel = document.getElementById("panel-product");
  main = panel;
  renderHeadline(panel);
  renderBlockers(panel);
  renderShipped(panel);
  renderRoadmap(panel);
  renderFlags(panel);
}

// ---- Business tab ----
// Most important first: decisions needed, next steps by owner, the key numbers, then the cost chart.
var NOT_SET = "Not set";

function money(value) {
  return "$" + value.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function decisionCard(d, decided) {
  var c = card(d.question);
  c.classList.add("decision");
  if (decided) {
    c.appendChild(el("div", "Decided: " + d.decided));
  }
  if (d.options.length > 0) {
    c.appendChild(el("div", "Options: " + d.options.join(" or "), "muted"));
  }
  c.appendChild(el("div", "Recommendation: " + (d.recommendation || NOT_SET), "muted"));
  c.appendChild(el("div", "Owner: " + d.owner + ". Raised " + d.date + ".", "muted"));
  return c;
}

function renderDecisions(parent, b) {
  var s = kitSection(parent, "Decisions needed", "business");
  safely(s, function (node) {
    if (b.openDecisions.length === 0) {
      node.appendChild(el("p", "No decisions are open.", "muted"));
    } else {
      node.appendChild(paged("decisions", "decisions", b.openDecisions, function (pageItems) {
        var g = grid("cols-2");
        pageItems.forEach(function (d) {
          g.appendChild(decisionCard(d, false));
        });
        return g;
      }));
    }
    if (b.decidedDecisions.length > 0) {
      var details = el("details", null, "more");
      details.appendChild(el("summary", "Decided (" + b.decidedDecisions.length + ")"));
      var g2 = grid("cols-2");
      b.decidedDecisions.forEach(function (d) {
        g2.appendChild(decisionCard(d, true));
      });
      details.appendChild(g2);
      node.appendChild(details);
    }
  });
}

function stepLine(li, step) {
  if (step.overdue) {
    li.appendChild(el("span", "Overdue", "tag overdue"));
    li.appendChild(el("span", ": ", "sr-only"));
  }
  if (step.done) {
    li.appendChild(el("span", "Done", "tag"));
    li.appendChild(el("span", ": ", "sr-only"));
  }
  li.appendChild(document.createTextNode(step.task));
  li.appendChild(el("div", step.due ? "Due " + step.due : "No due date", "muted"));
}

function renderSteps(parent, b) {
  var s = kitSection(parent, "Next steps by owner", null);
  safely(s, function (node) {
    if (b.stepsByOwner.length === 0) {
      node.appendChild(el("p", "No next steps.", "muted"));
      return;
    }
    var g = grid("cols-2");
    b.stepsByOwner.forEach(function (group) {
      var c = card(group.owner);
      c.appendChild(pagedList("steps-" + group.owner, "next steps for " + group.owner, group.steps, stepLine, "No next steps."));
      g.appendChild(c);
    });
    node.appendChild(g);
  });
}

function renderBusinessTiles(parent, b) {
  var s = el("section");
  s.appendChild(el("h2", "Key numbers", "sr-only"));
  safely(s, function (node) {
    var g = grid("kpis");
    var users = b.users.count === null ? NOT_SET : b.users.count;
    g.appendChild(kpiTile("Users", users, b.users.date ? "As of " + b.users.date : null));
    var cost = b.costTotal === null ? NOT_SET : money(b.costTotal);
    var costNote = b.costUnset > 0 && b.costTotal !== null ? b.costUnset + " of " + b.costs.length + " services not set" : "US dollars per month";
    g.appendChild(kpiTile("Monthly cost", cost, costNote));
    g.appendChild(kpiTile("Next sync", b.nextSync || NOT_SET, null));
    node.appendChild(g);
  });
  parent.appendChild(s);
}

function renderCosts(parent, b) {
  var s = kitSection(parent, "Cost breakdown", null);
  var c = card("Monthly cost by service");
  safely(c, function (node) {
    var set = b.costs.filter(function (line) {
      return line.monthly !== null;
    });
    if (set.length === 0) {
      node.appendChild(el("p", "No costs are set yet.", "muted"));
      node.appendChild(chartTable("Monthly cost by service", ["Service", "US dollars per month"], b.costs.map(function (line) {
        return [line.service, NOT_SET];
      })));
      return;
    }
    var rows = set.map(function (line) {
      return { label: line.service, value: line.monthly, text: money(line.monthly) };
    });
    node.appendChild(barChart(rows, "US dollars per month", "Monthly cost by service", c.titleId, "Service"));
    if (b.costUnset > 0) {
      var names = b.costs.filter(function (line) {
        return line.monthly === null;
      }).map(function (line) {
        return line.service;
      });
      node.appendChild(el("p", "Not set: " + names.join(", ") + ".", "muted"));
    }
    node.appendChild(el("p", "Total: " + money(b.costTotal) + " per month.", "muted"));
  });
  s.appendChild(c);
}

// Lowest in the tab. Shown only when business.json has links. link() uses textContent and only https URLs.
function renderLinks(parent, b) {
  if (!b.links || b.links.length === 0) {
    return;
  }
  var s = kitSection(parent, "Links", "business");
  var g = grid("cols-2");
  var c = card();
  b.links.forEach(function (item) {
    var line = el("div");
    line.appendChild(link(item.label, item.url));
    c.appendChild(line);
  });
  g.appendChild(c);
  s.appendChild(g);
}

function renderBusiness() {
  var panel = document.getElementById("panel-business");
  main = panel;
  var b = state.business;
  if (!b) {
    var s = el("section");
    s.appendChild(el("h2", "Business"));
    var src = state.sources.business;
    if (src && src.missing) {
      s.appendChild(el("p", "No business.json yet. Copy business.example.json to business.json and fill it in.", "muted"));
    } else if (src && !src.ok) {
      s.appendChild(el("p", "Could not load: " + src.error, "error"));
    } else {
      s.appendChild(el("p", "The business numbers are not available.", "muted"));
    }
    panel.appendChild(s);
    return;
  }
  renderDecisions(panel, b);
  renderSteps(panel, b);
  renderBusinessTiles(panel, b);
  renderCosts(panel, b);
  renderLinks(panel, b);
  panel.appendChild(el("p", "business.json updated " + b.updatedAt + ".", "muted"));
}

function currentTab() {
  var name = location.hash.slice(1);
  return TABS.indexOf(name) >= 0 ? name : "product";
}

function showTab(name, focus) {
  TABS.forEach(function (tab) {
    var selected = tab === name;
    var button = document.getElementById("tab-" + tab);
    button.setAttribute("aria-selected", selected ? "true" : "false");
    button.tabIndex = selected ? 0 : -1;
    document.getElementById("panel-" + tab).hidden = !selected;
    if (selected && focus) {
      button.focus();
    }
  });
  document.getElementById("area-label").hidden = name !== "engineering";
  fitLabels();
}

function selectTab(name, focus) {
  if (location.hash.slice(1) !== name) {
    location.hash = name;
  }
  showTab(name, focus);
}

document.getElementById("tabs").addEventListener("click", function (event) {
  var tab = event.target.closest("[role=tab]");
  if (tab) {
    selectTab(tab.dataset.tab, false);
  }
});
document.getElementById("tabs").addEventListener("keydown", function (event) {
  var index = TABS.indexOf(currentTab());
  var next = null;
  if (event.key === "ArrowRight") {
    next = (index + 1) % TABS.length;
  } else if (event.key === "ArrowLeft") {
    next = (index + TABS.length - 1) % TABS.length;
  } else if (event.key === "Home") {
    next = 0;
  } else if (event.key === "End") {
    next = TABS.length - 1;
  }
  if (next !== null) {
    event.preventDefault();
    selectTab(TABS[next], true);
  }
});
window.addEventListener("hashchange", function () {
  showTab(currentTab(), false);
});

var STALE_NOTE = "The dashboard was updated. Restart it to load the new code.";

// Sets the note only when its text changes, so a screen reader does not repeat it. Empty text hides it.
function setNote(text) {
  var note = document.getElementById("restart-note");
  if (note.textContent !== text) {
    note.textContent = text;
  }
  note.hidden = text === "";
}

function showUpdated() {
  var when = new Date(state.generatedAt);
  document.getElementById("updated").textContent = isNaN(when.getTime()) ? "Updated" : "Updated " + when.toLocaleTimeString();
}

function render() {
  var note = document.getElementById("restart-note");
  document.getElementById("restart").hidden = state.restartAvailable !== true;
  if (missingSection(state)) {
    setNote(STALE_NOTE);
    showUpdated();
    return;
  }
  if (note.textContent === STALE_NOTE) {
    setNote("");
  }
  TABS.forEach(function (tab) {
    document.getElementById("panel-" + tab).textContent = "";
  });
  showUpdated();
  var current = areaSelect.value;
  areaSelect.textContent = "";
  var all = el("option", "All areas");
  all.value = "all";
  areaSelect.appendChild(all);
  state.areas.forEach(function (a) {
    var o = el("option", a);
    o.value = a;
    areaSelect.appendChild(o);
  });
  areaSelect.value = state.areas.indexOf(current) >= 0 ? current : "all";
  renderProduct();
  renderEngineering();
  renderBusiness();
  fitLabels();
}

// The first section the page needs that the server did not send, or null.
function missingSection(s) {
  var need = [s && s.areas, s && s.board, s && s.prs, s && s.product, s && s.engineering, s && s.engineering && s.engineering.ciHealth];
  return need.some(function (part) {
    return part === undefined || part === null;
  });
}

var RESTART_WAIT_MS = 30000;

// Polls /api/state until the server answers again, then reloads the page.
function waitForServer(started) {
  fetch("/api/state", { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) {
        throw new Error("not ready");
      }
      try {
        sessionStorage.setItem("factoryRestarted", "1");
      } catch (e) {
        // Private mode: the reload still happens, only the message is lost.
      }
      location.reload();
    })
    .catch(function () {
      if (Date.now() - started > RESTART_WAIT_MS) {
        setNote("The dashboard did not come back in 30 seconds. Check the log, then reload.");
        document.getElementById("restart").setAttribute("aria-disabled", "false");
        return;
      }
      setTimeout(function () {
        waitForServer(started);
      }, 1000);
    });
}

// aria-disabled keeps keyboard focus on the button while it waits.
function restart() {
  var button = document.getElementById("restart");
  if (button.getAttribute("aria-disabled") === "true") {
    return;
  }
  button.setAttribute("aria-disabled", "true");
  setNote("Restarting…");
  fetch("/api/restart", { method: "POST", headers: { "X-Factory-Restart": "1" } })
    .then(function (r) {
      if (r.status !== 202) {
        throw new Error("refused");
      }
      setTimeout(function () {
        waitForServer(Date.now());
      }, 1000);
    })
    .catch(function () {
      button.setAttribute("aria-disabled", "false");
      setNote("The dashboard could not restart. Try again, or restart it by hand.");
      button.focus();
    });
}

function load(refresh) {
  document.getElementById("updated").textContent = "Loading";
  fetch("/api/state" + (refresh ? "?refresh=1" : ""))
    .then(function (r) {
      return r.json();
    })
    .then(function (data) {
      state = data;
      render();
    })
    .catch(function (e) {
      document.getElementById("updated").textContent = "Could not load: " + e.message;
    });
}

document.getElementById("restart").addEventListener("click", restart);
document.getElementById("refresh").addEventListener("click", function () {
  load(true);
});
areaSelect.addEventListener("change", function () {
  if (state) {
    render();
  }
});
showTab(currentTab(), false);
try {
  if (sessionStorage.getItem("factoryRestarted") === "1") {
    sessionStorage.removeItem("factoryRestarted");
    setNote("Dashboard restarted.");
  }
} catch (e) {
  // No session storage: skip the message.
}
load(false);
</script>
