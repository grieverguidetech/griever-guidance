AWSTemplateFormatVersion: '2010-09-09'
Description: Private bucket that holds the zipped data function code for the gg-app-data stack.

Resources:
  CodeBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub gg-artifacts-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
        - Id: expire-old-code
          Status: Enabled
          ExpirationInDays: 60

Outputs:
  CodeBucketName:
    Description: Pass this as the CodeBucket parameter of gg-app-data.
    Value: !Ref CodeBucket
