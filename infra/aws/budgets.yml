AWSTemplateFormatVersion: '2010-09-09'
Description: 'Monthly cost budget for Grievers Guidance with alerts at 5 and 10 USD.'

Parameters:
  AlertEmail:
    Type: String
    Description: Email that gets the budget alerts.

Resources:
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: gg-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 10
          Unit: USD
      NotificationsWithSubscribers:
      - Notification:
          NotificationType: ACTUAL
          ComparisonOperator: GREATER_THAN
          Threshold: 5
          ThresholdType: ABSOLUTE_VALUE
        Subscribers:
        - SubscriptionType: EMAIL
          Address: !Ref AlertEmail
      - Notification:
          NotificationType: ACTUAL
          ComparisonOperator: GREATER_THAN
          Threshold: 10
          ThresholdType: ABSOLUTE_VALUE
        Subscribers:
        - SubscriptionType: EMAIL
          Address: !Ref AlertEmail
