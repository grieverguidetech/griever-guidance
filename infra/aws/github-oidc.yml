AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub Actions OIDC trust for Grievers Guidance deploys.

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
      - sts.amazonaws.com
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: gg-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Federated: !Ref GitHubOidcProvider
          Action: sts:AssumeRoleWithWebIdentity
          Condition:
            StringEquals:
              token.actions.githubusercontent.com:aud: sts.amazonaws.com
              token.actions.githubusercontent.com:sub: repo:grieverguidetech/griever-guidance:ref:refs/heads/main
      Policies:
      - PolicyName: gg-github-deploy-cfn
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: DeployAppStacks
            Effect: Allow
            Action:
            - cloudformation:CreateChangeSet
            - cloudformation:DescribeChangeSet
            - cloudformation:ExecuteChangeSet
            - cloudformation:DeleteChangeSet
            - cloudformation:DescribeStacks
            - cloudformation:DescribeStackEvents
            Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/gg-app-*/*
          - Sid: ReadTemplates
            Effect: Allow
            Action:
            - cloudformation:ValidateTemplate
            - cloudformation:GetTemplateSummary
            Resource: '*'
          - Sid: PassExecRole
            Effect: Allow
            Action: iam:PassRole
            Resource: !GetAtt CfnExecRole.Arn
            Condition:
              StringEquals:
                iam:PassedToService: cloudformation.amazonaws.com
  CfnExecRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: gg-cfn-exec
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: cloudformation.amazonaws.com
          Action: sts:AssumeRole
          Condition:
            StringEquals:
              aws:SourceAccount: !Ref AWS::AccountId
