name = "griever-guidance-gateway"
main = "src/worker.ts"
compatibility_date = "2025-09-01"
# nodejs_compat: src/worker.ts (Hono) uses node:crypto's randomUUID.
compatibility_flags = ["nodejs_compat"]

# grieversguidance.com is the official domain (REQUIREMENTS.md §6). Wrangler
# creates the DNS record and certificate for this on deploy.
routes = [
  { pattern = "api.grieversguidance.com", custom_domain = true }
]

[vars]
# Comma-separated list of allowed CORS origins — the web app, which is the only
# browser client that calls the gateway.
# An empty string means no origin ever matches in src/worker.ts's Hono `cors()`
# middleware — every cross-origin request is blocked, not allowed. There is
# no "allow all" mode here; always set this explicitly.
CORS_ORIGINS = "https://web.grieversguidance.com"

# Supabase project (accounts). The gateway verifies the caller's session token
# against ${SUPABASE_URL}/auth/v1/.well-known/jwks.json and talks to PostgREST
# with the anon key plus that token, so RLS applies. The anon key is public by
# design; there is no service-role key. Empty means /me/* answers 503.
# In production, deploy.yml overrides both from the repo variables SUPABASE_URL
# and SUPABASE_ANON_KEY (when set), so these stay empty here.
SUPABASE_URL = ""
SUPABASE_ANON_KEY = ""

# Clerk accounts. The gateway verifies the caller's Clerk session token against
# the issuer's published keys. No Clerk secret key is used or stored here.
# CLERK_ISSUER is the https Frontend API URL of the Clerk instance.
# CLERK_AUTHORIZED_PARTIES is a comma-separated list of web/mobile origins
# allowed in the token's `azp` claim. Empty means not configured.
# In production, deploy.yml overrides CLERK_ISSUER from the repo variable of the
# same name (when set), so both stay empty here.
CLERK_ISSUER = ""
CLERK_AUTHORIZED_PARTIES = ""

# Invite emails (POST /invites). The sender address must be on a domain verified
# in Resend. RESEND_API_KEY is a Worker secret, set by deploy.yml from the
# GitHub secret of the same name; it never goes in this file. Skipped when the
# GitHub secret is empty; a key already on the Worker stays. To remove it:
# wrangler secret delete RESEND_API_KEY --config apps/gateway/wrangler.toml
# With no key on the Worker, POST /invites answers 503 and nothing else is affected.
INVITE_FROM_EMAIL = "Grievers Guidance <invites@grieversguidance.com>"
# The web app origin (REQUIREMENTS.md section 6 domain table); invite links point here.
WEB_URL = "https://web.grieversguidance.com"

# Data function (AWS Lambda function URL, AuthType AWS_IAM; infra/aws/data.yml). The gateway
# signs each call with SigV4 using the Worker secrets DATA_FUNCTION_ACCESS_KEY_ID and
# DATA_FUNCTION_SECRET_ACCESS_KEY (set by deploy.yml from GitHub secrets; never in this file).
# The URL is only known after the AWS deploy, so deploy.yml overrides DATA_FUNCTION_URL from the
# repo variable of the same name (when set). Empty means /me/* answers 503.
# The region has no code default; the project's SCP allows only us-east-2.
DATA_FUNCTION_URL = ""
DATA_FUNCTION_REGION = "us-east-2"
