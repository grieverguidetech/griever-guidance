name = "griever-guidance-gateway"
main = "src/worker.ts"
compatibility_date = "2025-09-01"
# nodejs_compat: src/worker.ts (Hono) uses node:crypto's randomUUID, and the
# Convex SDK needs it too.
compatibility_flags = ["nodejs_compat"]

[vars]
# Comma-separated list of allowed CORS origins.
# Cloudflare appended a random suffix to this project's pages.dev domain
# (the plain "griever-guidance-web.pages.dev" was already taken elsewhere) —
# confirm the real one with `wrangler pages deployment list --project-name
# griever-guidance-web` before changing this, rather than guessing the name.
# An empty string means no origin ever matches in src/worker.ts's Hono `cors()`
# middleware — every cross-origin request is blocked, not allowed. There is
# no "allow all" mode here; always set this explicitly.
CORS_ORIGINS = "https://griever-guidance-web-1c3.pages.dev"
